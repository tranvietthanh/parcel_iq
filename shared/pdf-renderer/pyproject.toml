[project]
name = "ozpr-pdf-renderer"
version = "0.1.0"
description = "Shared PDF report generator for OZ Property Report"
requires-python = ">=3.12"

dependencies = [
    "reportlab>=4.2,<5",
    "httpx>=0.28,<1",
    "minio>=7.0,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pypdf>=5,<6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pdf_renderer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
